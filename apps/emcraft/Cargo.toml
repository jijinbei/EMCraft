[package]
name = "emcraft"
description = "EMCraft desktop app: the iced window (crates/ui-iced) on the system's file dialog and the control channel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "emcraft"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The GPU kernels on the CPU (solve.device `cubecl-cpu`), off in shipped builds
# (crates/gpu/Cargo.toml).
cubecl-cpu = ["emcraft-engine/cubecl-cpu"]

[dependencies]
emcraft-control = { workspace = true }
emcraft-engine = { workspace = true }
emcraft-picker = { workspace = true }
emcraft-ui-core = { workspace = true }
emcraft-ui-iced = { workspace = true }

# The message box a window program shows when its window cannot open (no console there).
[target.'cfg(windows)'.dependencies]
rfd = "0.17"

[build-dependencies]
# The icon and version resource of emcraft.exe (build.rs, docs/adr/0001-libraries.md).
winresource = { version = "0.1.34", default-features = false }

# CUDA links CubeCL's prebuilt LLVM, which has no Windows GNU build (the installer's
# cross-compiled target, docs/install-windows.md).
[target.'cfg(not(all(windows, target_env = "gnu")))'.dependencies]
emcraft-engine = { workspace = true, features = ["cuda"] }
