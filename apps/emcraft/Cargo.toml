[package]
name = "emcraft"
description = "EMCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "emcraft"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The GPU kernels on the CPU (solve.device `cubecl-cpu`), off in shipped builds
# (crates/gpu/Cargo.toml).
cubecl-cpu = ["emcraft-engine/cubecl-cpu"]

[dependencies]
emcraft-engine = { workspace = true }
emcraft-ui-egui = { workspace = true }
serde_json = { workspace = true }
# The control channel's per-launch token (docs/adr/0001-libraries.md).
getrandom = "0.3"
# The system's file dialog for projects (docs/adr/0001-libraries.md).
rfd = "0.17"

[build-dependencies]
# The icon and version resource of emcraft.exe (build.rs, docs/adr/0001-libraries.md).
winresource = { version = "0.1.34", default-features = false }

# CUDA links CubeCL's prebuilt LLVM, which has no Windows GNU build (the installer's
# cross-compiled target, docs/install-windows.md).
[target.'cfg(not(all(windows, target_env = "gnu")))'.dependencies]
emcraft-engine = { workspace = true, features = ["cuda"] }
