name: Windows installer

# The installer is built the same way as on a developer's Linux machine
# (`cargo xtask installer-windows`, docs/install-windows.md): cross-compiled with MinGW-w64 and
# packed by NSIS, both from Nix. A Windows runner then installs it silently and runs it.

# A `v*` tag builds, smoke-tests and attaches the installer to that release; any branch can be
# built by hand (Actions tab, or `gh workflow run release-windows.yml --ref BRANCH`): the
# installer is then the run's `emcraft-windows-installer` artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free the runner's disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-gnu
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Build the installer
        run: |
          cargo xtask installer-windows
          mkdir dist
          mv target/EMCraft-*-setup.exe dist/
          sha256sum dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: emcraft-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: emcraft-windows-installer
          path: dist
      - name: Install, run the CLI (commands, a script, the high-pass sample) and the app's --version, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\EMCraft-*-setup.exe | Select-Object -First 1).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          $dir = "$env:LOCALAPPDATA\Programs\EMCraft"
          $commands = & "$dir\emcraft-cli.exe" commands
          if ($LASTEXITCODE -ne 0) { throw "emcraft-cli commands failed" }
          $commands | Select-Object -First 5
          $script = Join-Path $env:RUNNER_TEMP 'cavity.json'
          Set-Content -Path $script -Value '[{"command":"geometry.waveguide","params":{"width":22.86,"height":10.16,"sections":[{"length":30,"material":"vacuum"}]}},{"command":"mesh.generate","params":{"size":5}},{"command":"solve.eigenmodes","params":{"near":8,"count":2,"order":1}}]'
          & "$dir\emcraft-cli.exe" run $script | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { throw "emcraft-cli run failed" }
          $out = Join-Path $env:RUNNER_TEMP 'highpass'
          & "$dir\emcraft-cli.exe" sample highpass --out $out | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { throw "emcraft-cli sample highpass failed" }
          if (-not (Test-Path "$out\s-parameters.png")) { throw "the sample wrote no s-parameters.png" }
          $app = Start-Process -Wait -PassThru -FilePath "$dir\emcraft.exe" -ArgumentList '--version' -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($app.ExitCode -ne 0) { throw "emcraft --version failed" }
          $open = (Get-ItemProperty 'HKCU:\Software\Classes\EMCraft.Project\shell\open\command').'(default)'
          if ($open -notlike '*emcraft.exe*%1*') { throw ".emcraft is not associated: $open" }
          Start-Process -Wait -FilePath "$dir\uninstall.exe" -ArgumentList '/S', "_?=$dir"
          if (Test-Path "$dir\emcraft.exe") { throw "the uninstaller left emcraft.exe" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: emcraft-windows-installer
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "EMCraft $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.exe --repo "$GITHUB_REPOSITORY" --clobber
