name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The GPU crate links CubeCL's LLVM into every test binary: without debug information they
  # still fill a runner's disk unless it is cleared first.
  CARGO_PROFILE_RELEASE_DEBUG: "false"
  CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
  # The shipped binaries' whole-program optimisation (Cargo.toml) would link each of the dozens
  # of test binaries in one slow thread: the tests build with thin LTO in 16 units instead. The
  # results are the same bit for bit (the oracle's fixtures, blessed under both, are identical).
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Free the runner's disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: rustfmt, clippy
      # Compiled dependencies and the workspace's build, keyed on Cargo.lock and the toolchain.
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the desktop app
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo xtask layers
      - run: cargo xtask dupes --fail
      - run: cargo xtask colours
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # In release, sharing the build with the oracle below (debug assertions are left to local
      # runs); every test in one pool (.config/nextest.toml), then the doctests.
      - run: cargo xtask test --release
      # The oracle's results are deterministic bit for bit (AGENTS.md): a pass with the same
      # inputs proves the same results. The key hashes every crate the oracle binary is built
      # from, the cases and the lock file, with the compiler's version; a change to the UI, the
      # apps or the docs keeps it and skips the run.
      - name: Oracle inputs
        id: oracle-key
        run: echo "key=oracle-pass-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'tests/oracle/**', 'crates/model/**', 'crates/mesh/**', 'crates/tetmesh/**', 'crates/fem/**', 'crates/theory/**', 'crates/solver/**', 'crates/fdtd/**', 'crates/gpu/**', 'crates/io/**', 'crates/render/**', 'crates/engine/**', 'crates/testkit/**') }}" >> "$GITHUB_OUTPUT"
      - name: Oracle passed before with these inputs
        id: oracle-cache
        uses: actions/cache/restore@v4
        with:
          path: .oracle-pass
          key: ${{ steps.oracle-key.outputs.key }}
      - name: Oracle
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: cargo run --release -p emcraft-testkit --bin oracle -- --no-write
      - name: Record the pass
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: git rev-parse HEAD > .oracle-pass
      - uses: actions/cache/save@v4
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          path: .oracle-pass
          key: ${{ steps.oracle-key.outputs.key }}

  heavy:
    runs-on: ubuntu-latest
    steps:
      - name: Free the runner's disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      # As the oracle: the heavy tests rerun only when the code they are built from changes.
      - name: Heavy test inputs
        id: heavy-key
        run: echo "key=heavy-pass-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.config/**', 'crates/**', 'apps/**') }}" >> "$GITHUB_OUTPUT"
      - name: Heavy tests passed before with these inputs
        id: heavy-cache
        uses: actions/cache/restore@v4
        with:
          path: .heavy-pass
          key: ${{ steps.heavy-key.outputs.key }}
      - uses: Swatinem/rust-cache@v2
        if: steps.heavy-cache.outputs.cache-hit != 'true'
      - name: System libraries for the desktop app
        if: steps.heavy-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: taiki-e/install-action@v2
        if: steps.heavy-cache.outputs.cache-hit != 'true'
        with:
          tool: cargo-nextest
      # Every package's ignored tests (the slow ones the gate leaves out, AGENTS.md).
      - name: Heavy tests
        if: steps.heavy-cache.outputs.cache-hit != 'true'
        run: cargo xtask test --heavy --release
      - name: Record the pass
        if: steps.heavy-cache.outputs.cache-hit != 'true'
        run: git rev-parse HEAD > .heavy-pass
      - uses: actions/cache/save@v4
        if: steps.heavy-cache.outputs.cache-hit != 'true'
        with:
          path: .heavy-pass
          key: ${{ steps.heavy-key.outputs.key }}
