[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal
emcraft-macros = { path = "crates/macros" }
emcraft-model = { path = "crates/model" }
emcraft-mesh = { path = "crates/mesh" }
emcraft-tetmesh = { path = "crates/tetmesh" }
emcraft-fem = { path = "crates/fem" }
emcraft-theory = { path = "crates/theory" }
emcraft-render = { path = "crates/render" }
emcraft-solver = { path = "crates/solver" }
emcraft-fdtd = { path = "crates/fdtd" }
emcraft-gpu = { path = "crates/gpu" }
emcraft-io = { path = "crates/io" }
emcraft-templates = { path = "crates/templates" }
emcraft-engine = { path = "crates/engine" }
emcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Complex numbers for the frequency-domain solver (docs/adr/0001-libraries.md).
num-complex = { version = "0.4", default-features = false, features = ["std"] }
faer = "0.24"
# GPU kernels written in Rust (docs/adr/0002-gpu.md); pinned, its API moves between releases.
# Its CPU and CUDA runtimes link a prebuilt LLVM, turned on where one exists (crates/gpu/Cargo.toml,
# the apps' manifests): not in the Windows GNU build cross-compiled from Linux. Without its
# default `persistence`, which caches autotune results and compiled kernels on disk in an embedded
# SQLite (turso): the kernels compile again in each run.
cubecl = { version = "=0.11.3", default-features = false, features = ["std", "stdlib"] }
rayon = "1"

# geometry import: 3MF packages (zip, XML), the same lines as FieldCraft
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
# SolidCraft designs, read through SolidCraft's exchange snapshot: the one SolidCraft crate EMCraft
# depends on, pinned to a commit (docs/adr/0003-solidcraft-exchange.md).
solidcraft-exchange = { git = "https://github.com/jijinbei/solidcraft", rev = "3390d0511e9f97a530114fc845fe26bc424b8fd6" }

# images (PNG field pictures)
png = "0.18"
ab_glyph = "0.2.32"

# ui: the same egui/eframe line as FieldCraft. The window draws with wgpu (the 3D view's depth-buffered
# renderer, crates/ui-egui/src/gpu3d) and falls back to glow (OpenGL 2) where wgpu finds no adapter
# (docs/adr/0004-gpu-viewport.md).
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "glow", "default_fonts", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
# `!(x > tol)` is our idiom for "not a usable number" (NaN-safe).
neg_cmp_op_on_partial_ord = "allow"
# Index loops read like the formulas in numerical kernels (rows, columns, pivots).
needless_range_loop = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Assembly and the sparse factorization are compute loops; their verification runs (tests)
# need them optimised.
[profile.dev.package.emcraft-solver]
opt-level = 3

[profile.dev.package.emcraft-fem]
opt-level = 3

[profile.dev.package.emcraft-mesh]
opt-level = 3

[profile.dev.package.emcraft-tetmesh]
opt-level = 3

[profile.dev.package.emcraft-fdtd]
opt-level = 3

[profile.dev.package.emcraft-gpu]
opt-level = 3

# The shipped binaries: whole-program optimisation in one unit and no symbols make them about a
# third smaller than thin LTO in 16 units with line tables, with the same numbers bit for bit
# (Rust does not contract or reassociate floating point); CI's tests build with thin LTO
# (.github/workflows/ci.yml). The window's crates are optimised for size: their speed is
# egui's layout, far from the solvers' loops, which stay at opt-level 3.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package.egui]
opt-level = "s"

[profile.release.package.epaint]
opt-level = "s"

[profile.release.package.eframe]
opt-level = "s"

[profile.release.package.egui_glow]
opt-level = "s"

[profile.release.package.glow]
opt-level = "s"

[profile.release.package.winit]
opt-level = "s"

[profile.release.package.rfd]
opt-level = "s"

[profile.release.package.emcraft-ui-egui]
opt-level = "s"

# The truck crates SolidCraft patches (its kernel needs them), from the same SolidCraft commit as
# solidcraft-exchange (docs/adr/0003-solidcraft-exchange.md).
[patch.crates-io]
truck-geometry = { git = "https://github.com/jijinbei/solidcraft", rev = "3390d0511e9f97a530114fc845fe26bc424b8fd6" }
truck-shapeops = { git = "https://github.com/jijinbei/solidcraft", rev = "3390d0511e9f97a530114fc845fe26bc424b8fd6" }
truck-stepio = { git = "https://github.com/jijinbei/solidcraft", rev = "3390d0511e9f97a530114fc845fe26bc424b8fd6" }
truck-meshalgo = { git = "https://github.com/jijinbei/solidcraft", rev = "3390d0511e9f97a530114fc845fe26bc424b8fd6" }
matext4cgmath = { git = "https://github.com/jijinbei/solidcraft", rev = "3390d0511e9f97a530114fc845fe26bc424b8fd6" }
