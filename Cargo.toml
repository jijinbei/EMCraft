[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Rust 1.100: the never type `!`, the allocator API and `DropGuard` stable.
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal
emcraft-macros = { path = "crates/macros" }
emcraft-i18n = { path = "crates/i18n" }
emcraft-model = { path = "crates/model" }
emcraft-mesh = { path = "crates/mesh" }
emcraft-tetmesh = { path = "crates/tetmesh" }
emcraft-fem = { path = "crates/fem" }
emcraft-theory = { path = "crates/theory" }
emcraft-render = { path = "crates/render" }
emcraft-solver = { path = "crates/solver" }
emcraft-fdtd = { path = "crates/fdtd" }
emcraft-gpu = { path = "crates/gpu" }
emcraft-control = { path = "crates/control" }
emcraft-gpu3d = { path = "crates/gpu3d" }
emcraft-picker = { path = "crates/picker" }
emcraft-io = { path = "crates/io" }
emcraft-templates = { path = "crates/templates" }
emcraft-engine = { path = "crates/engine" }
emcraft-ui-core = { path = "crates/ui-core" }
emcraft-ui-iced = { path = "crates/ui-iced" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Complex numbers for the frequency-domain solver (docs/adr/0001-libraries.md).
num-complex = { version = "0.4", default-features = false, features = ["std"] }
faer = "0.24"
# GPU kernels written in Rust (docs/adr/0002-gpu.md); pinned, its API moves between releases.
# Its CPU and CUDA runtimes link a prebuilt LLVM, turned on where one exists (crates/gpu/Cargo.toml,
# the apps' manifests): not in the Windows GNU build cross-compiled from Linux. Without its
# default `persistence`, which caches autotune results and compiled kernels on disk in an embedded
# SQLite (turso): the kernels compile again in each run.
cubecl = { version = "=0.11.3", default-features = false, features = ["std", "stdlib"] }
rayon = "1"

# geometry import: 3MF packages (zip, XML), the same lines as FieldCraft
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
# SolidCraft designs, read through SolidCraft's exchange snapshot: the one SolidCraft crate EMCraft
# depends on, pinned to a commit (docs/adr/0003-solidcraft-exchange.md).
solidcraft-exchange = { git = "https://github.com/jijinbei/solidcraft", rev = "4c9ddde19843e5df2b4e782f8738449bffd59d6d" }

# images (PNG field pictures)
png = "0.18"
ab_glyph = "0.2.32"

# tests only (dev-dependencies, docs/adr/0001-libraries.md): tolerance asserts, property tests on
# hostile input (fixed seed: the gate stays deterministic) and table tests.
approx = { version = "0.5", default-features = false, features = ["std"] }
proptest = { version = "1", default-features = false, features = ["std"] }
rstest = { version = "0.26", default-features = false }

# ui: the window (crates/ui-iced, docs/adr/0007-iced-window.md, docs/adr/0008-retire-egui.md): iced's
# main line, pinned, for the wgpu the rest of the build has (iced 0.14 is on wgpu 27); it draws with
# wgpu (the 3D view's depth-buffered renderer, crates/gpu3d) and tiny-skia on the CPU.
iced = { git = "https://github.com/iced-rs/iced", rev = "c3d2cfd0a8503fd4b13754467953b427be259c55", default-features = false, features = ["wgpu", "tiny-skia", "canvas", "image-without-codecs", "x11", "wayland", "wayland-dlopen", "thread-pool"] }
# The window drawn without one (ui.render): iced's user interface run headless.
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "c3d2cfd0a8503fd4b13754467953b427be259c55" }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "c3d2cfd0a8503fd4b13754467953b427be259c55" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
# A fallback that costs is computed only when taken; chains over hand-written matches.
or_fun_call = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
# No mutable or by-reference argument a function does not need, no `self` it does not read, no
# copy it does not make use of; text appended with `write!`, not a `format!` built to be copied.
needless_pass_by_ref_mut = "warn"
trivially_copy_pass_by_ref = "warn"
ref_option = "warn"
unused_self = "warn"
assigning_clones = "warn"
stable_sort_primitive = "warn"
format_push_string = "warn"
type_complexity = "allow"
# `!(x > tol)` is our idiom for "not a usable number" (NaN-safe).
neg_cmp_op_on_partial_ord = "allow"
# Index loops read like the formulas in numerical kernels (rows, columns, pivots).
needless_range_loop = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Assembly and the sparse factorization are compute loops; their verification runs (tests)
# need them optimised.
[profile.dev.package.emcraft-solver]
opt-level = 3

[profile.dev.package.emcraft-fem]
opt-level = 3

[profile.dev.package.emcraft-mesh]
opt-level = 3

[profile.dev.package.emcraft-tetmesh]
opt-level = 3

[profile.dev.package.emcraft-fdtd]
opt-level = 3

[profile.dev.package.emcraft-gpu]
opt-level = 3

# The shipped binaries: whole-program optimisation in one unit and no symbols make them about a
# third smaller than thin LTO in 16 units with line tables, with the same numbers bit for bit
# (Rust does not contract or reassociate floating point); CI's tests build with thin LTO
# (.github/workflows/ci.yml). The window's crates are optimised for size: their speed is
# the window's layout, far from the solvers' loops, which stay at opt-level 3.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package.winit]
opt-level = "s"

[profile.release.package.rfd]
opt-level = "s"

[profile.release.package.emcraft-ui-iced]
opt-level = "s"

