[package]
name = "emcraft-ui-egui"
description = "EMCraft's desktop UI: ribbon of engine commands, browser, command dialogs, results views (S-parameters, fields with phase animation, port modes, far field), worker jobs with progress and cancel, the control channel's methods and headless scenarios"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
emcraft-engine = { workspace = true }
emcraft-macros = { workspace = true }
emcraft-model = { workspace = true }
emcraft-render = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# Reading installed fonts' names and character maps (fonts::system; already in the build
# through egui's ab_glyph; docs/adr/0001-libraries.md).
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

# The scenarios run the GPU kernels on the CPU (setup_device).
[target.'cfg(not(all(windows, target_env = "gnu")))'.dev-dependencies]
emcraft-gpu = { workspace = true, features = ["cubecl-cpu"] }
