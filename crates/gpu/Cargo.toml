[package]
name = "emcraft-gpu"
description = "EMCraft's solvers on GPUs through CubeCL: the time-domain leapfrog in single or double precision, the factorization's large fronts in complex double"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# NVIDIA GPUs (the driver is loaded at run time: a build without CUDA installed still runs).
cuda = ["cubecl/cuda"]

[dependencies]
emcraft-macros = { workspace = true }
emcraft-fdtd = { workspace = true }
emcraft-solver = { workspace = true }
cubecl = { workspace = true }
num-complex = { workspace = true, features = ["bytemuck"] }
bytemuck = "1"

# The CPU runtime links CubeCL's prebuilt LLVM, which has no Windows GNU build (the installer's
# cross-compiled target, docs/install-windows.md): there the CPU backend reports "not built".
[target.'cfg(not(all(windows, target_env = "gnu")))'.dependencies]
cubecl = { workspace = true, features = ["cpu"] }

[dev-dependencies]
emcraft-model = { workspace = true }
