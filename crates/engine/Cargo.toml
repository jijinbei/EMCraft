[package]
name = "emcraft-engine"
description = "EMCraft commands: every user-visible action as a CommandSpec run by Session::execute with rollback and a panic guard, scripts, samples, and headless pictures of fields and S-parameters"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
emcraft-macros = { workspace = true }
emcraft-model = { workspace = true }
emcraft-mesh = { workspace = true }
emcraft-fem = { workspace = true }
emcraft-io = { workspace = true }
emcraft-theory = { workspace = true }
emcraft-render = { workspace = true }
emcraft-solver = { workspace = true }
emcraft-fdtd = { workspace = true }
emcraft-gpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# The time-domain solver on NVIDIA GPUs (solve.time_domain `device` cuda).
cuda = ["emcraft-gpu/cuda"]
